<!-- Carousel -->
<div id="demo" class="carousel slide">
    <!-- Indikátory -->
    <div class="carousel-indicators">
        <button type="button" data-bs-target="#demo" data-bs-slide-to="0" class="active"></button>
        <button type="button" data-bs-target="#demo" data-bs-slide-to="1"></button>
        <button type="button" data-bs-target="#demo" data-bs-slide-to="2"></button>
    </div>

    <!-- Obsah -->
    <div class="carousel-inner">
        <div class="carousel-item active">
            <img src="https://picsum.photos/1200/400?random=1" alt="Servis" class="d-block w-100">
            <div class="carousel-caption d-none d-md-block">
                <h3>Prinášame komplexné riešenia na rôzne problémy</h3>
            </div>
        </div>

        <div class="carousel-item">
            <img src="https://picsum.photos/1200/400?random=2" alt="Objednávky" class="d-block w-100">
            <div class="carousel-caption d-none d-md-block">
                <h3>Objednávky vybavíme rýchlo a spoľahlivo</h3>
                <p>Rezervácia online už do 6 hodín!</p>
            </div>
        </div>

        <div class="carousel-item">
            <img src="https://picsum.photos/1200/400?random=3" alt="Tipy" class="d-block w-100">
            <div class="carousel-caption d-none d-md-block">
                <h3>Zaujímavosti zo servisu</h3>
                <p>Každý deň nové tipy pre vodičov</p>
            </div>
        </div>
    </div>

    <!-- Ovládanie -->
    <button class="carousel-control-prev" type="button" data-bs-target="#demo" data-bs-slide="prev">
        <span class="carousel-control-prev-icon"></span>
        <span class="visually-hidden">Predchádzajúce</span>
    </button>
    <button class="carousel-control-next" type="button" data-bs-target="#demo" data-bs-slide="next">
        <span class="carousel-control-next-icon"></span>
        <span class="visually-hidden">Ďalšie</span>
    </button>
</div>
